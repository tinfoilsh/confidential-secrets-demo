cvm-version: 0.11.1
cpus: 2
memory: 2048

# The keyserver this deployment fetches DEMO_SECRET from at boot.
# This value is measured into the enclave attestation.
vault-url: https://keys.tanyaverma.sh:9443

networks:
  web:

containers:
  - name: "demo"
    image: "ghcr.io/tinfoilsh/confidential-secrets-demo@sha256:cb819b30a0df5d8cf548d7ec5a467f4504198edda202a4e8f142e81141f187c0" # v0.0.2
    restart: always
    networks: [web]
    secrets:
      - DEMO_SECRET

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /
    - /health
    - /prove
