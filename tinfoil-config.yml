cvm-version: 0.14.15
cpus: 2
memory: 2048

# Measured into the enclave attestation.
keyserver-url: https://keys.tanyaverma.sh:9443

networks:
  web:

containers:
  - name: "demo"
    image: "ghcr.io/tinfoilsh/confidential-secrets-demo@sha256:8cf9a4a9c840bdfa4ad1c2b0555e8a72db04d2276ae8cb375abcc8fd9f50884b" # v0.0.6
    restart: always
    networks: [web]
    secrets:
      - DEMO_SECRET

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /
    - /health
    - /prove
