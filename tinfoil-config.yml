cvm-version: 0.14.15
cpus: 2
memory: 2048

# Measured into the enclave attestation.
keyserver-url: https://keys.tanyaverma.sh:9443

networks:
  web:

containers:
  - name: "demo"
    image: "ghcr.io/tinfoilsh/confidential-secrets-demo@sha256:627e3ca2c402fc8fd191acdd9b88cf727a266c2051dd8455f35776482132169c" # v0.0.7
    restart: always
    networks: [web]
    secrets:
      - DEMO_SECRET

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /
    - /health
    - /prove
