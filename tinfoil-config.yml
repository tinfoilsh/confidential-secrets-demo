cvm-version: 0.11.1
cpus: 2
memory: 2048

# The keyserver this deployment fetches DEMO_SECRET from at boot.
# This value is measured into the enclave attestation.
vault-url: https://keys.box2.tinfoil.sh:9443

networks:
  web:

containers:
  - name: "demo"
    image: "ghcr.io/tinfoilsh/confidential-secrets-demo@sha256:bf36d2a152ba3bafa60e500b3b4051ec6fa8d1e3b9eac8c77787bab1329682b9" # v0.0.1
    restart: always
    networks: [web]
    secrets:
      - DEMO_SECRET

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /
    - /health
    - /prove
